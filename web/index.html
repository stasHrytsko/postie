<title>Postie</title>
<script>/* light or dark is set before anything is drawn: the saved choice, else the phone's own setting. Toggle — the corner of the home screen. */
(function () { var l = null; try { l = localStorage.getItem('postie:look'); } catch (e) {}
  if (l !== 'post' && l !== 'night') l = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'post';
  document.documentElement.setAttribute('data-look', l);
  var g = null; try { g = localStorage.getItem('postie:lang'); } catch (e) {} document.documentElement.lang = g === 'en' ? 'en' : 'ru';
  var m = document.createElement('meta'); m.name = 'theme-color'; m.content = l === 'night' ? '#131926' : '#F5F0E6'; document.head.appendChild(m); })();</script>
