<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Postie Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500&family=Playfair+Display:wght@700&display=swap">
<link rel="stylesheet" href="kit/paper-ui.css">
<style>
/* Demo of the paper sheet on a game screen (Outgrow, level 4). Pieces and marks are plain HTML. */
body { margin: 0; }
.tools { display: flex; justify-content: space-between; margin: -4px -4px -6px; }
.tools button { width: 40px; height: 40px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
.tools svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.paper-head { position: relative; padding-right: 86px; }
.paper-head .icon { fill: var(--ink); }
.dots { margin-left: 10px; letter-spacing: .12em; }
.stamp { filter: drop-shadow(0 1px 1.5px rgb(45 39 33 / 25%)); position: absolute; right: 0; top: -6px; width: 64px; height: 76px; background: #F7EEE2; padding: 5px; box-sizing: border-box;
  -webkit-mask: linear-gradient(#000 0 0) content-box, radial-gradient(2.6px at 50% 50%, #0000 96%, #000) -4px -4px / 8px 8px;
          mask: linear-gradient(#000 0 0) content-box, radial-gradient(2.6px at 50% 50%, #0000 96%, #000) -4px -4px / 8px 8px; }
.stamp i { display: grid; place-items: center; height: 100%; background: var(--accent-yellow); }
.stamp svg { width: 70%; fill: var(--ink); stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; }
.postmark { position: absolute; right: 48px; top: 10px; width: 46px; height: 34px; }
.moves { font: 500 24px/1 "Caveat", cursive; color: var(--ink); margin-top: -6px; }
.moves span { display: inline-block; border-bottom: 1.5px solid var(--accent-yellow); padding: 0 4px 2px 0; }
.tile { position: absolute; inset: 7%; border-radius: 5px; color: #fff; display: grid; place-content: center; text-align: center;
  font: 700 clamp(11px, 3.6vw, 17px)/1.05 "Playfair Display", Georgia, serif;
  box-shadow: 0 1.5px 0 rgb(0 0 0 / 14%), 0 2px 4px rgb(45 39 33 / 18%); }
.tile b { font-size: 1.05em; line-height: 1; }
.wall { position: absolute; inset: 6%; border-radius: 4px; background: var(--ink); }
.dot { position: absolute; left: 50%; top: 50%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: #7d7a74; transform: translate(-50%, -50%); }
.dot.l { left: 38%; } .dot.r { left: 62%; }
</style>
</head><body>
<main class="game-screen">
  <section class="paper-card">
    <div class="paper-sheet"></div>
    <div class="paper-content">
      <div class="tools">
        <button aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <span style="display:flex">
          <button aria-label="How to play"><svg viewBox="0 0 24 24"><path d="M9.2 9a2.9 2.9 0 115.6 1c0 2-2.8 2.3-2.8 4.4M12 18.4v.1"/></svg></button>
          <button aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5"/></svg></button>
        </span>
      </div>
      <div class="paper-head">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v4.5A2.5 2.5 0 017.5 10H3zM14 3h7v7h-4.5A2.5 2.5 0 0114 7.5zM3 14h4.5A2.5 2.5 0 0110 16.5V21H3zM16.5 14H21v7h-7v-4.5a2.5 2.5 0 012.5-2.5z"/></svg>
        <span class="divider"></span>
        <div><div class="title">OUTGROW</div><div class="meta">LEVEL 4<span class="dots">●●●○</span></div></div>
        <svg class="postmark" viewBox="0 0 46 34" fill="none" stroke="#2C3E5F" stroke-width="1.2" opacity=".75"><path d="M0 6c8-4 16 4 24 0s16-4 22 0M0 14c8-4 16 4 24 0s16-4 22 0M0 22c8-4 16 4 24 0s16-4 22 0M0 30c8-4 16 4 24 0s16-4 22 0"/></svg>
        <div class="stamp"><i><svg viewBox="0 0 24 24"><path d="M12 22v-10" fill="none"/><path d="M12 13c0-5-4-8-9-8 0 5 4 8 9 8zM12 11c0-5 4-8 9-8 0 5-4 8-9 8z" stroke="none"/></svg></i></div>
      </div>
      <div class="moves"><span>Moves 0</span></div>
      <div class="puzzle-grid" id="g" style="--cols: 5"></div>
    </div>
  </section>
</main>
<script>
var T = { 3: 'w', 4: 'w', 5: 'd', 11: 'd2', 10: ['#D8A43C', '◆', '1/5'], 15: 'd2', 16: ['#8EA97E', '●', '1/12'], 17: 'd', 19: 'd', 21: 'd', 22: ['#6FA3BE', '■', '1/12'], 23: 'd', 24: ['#D77A5E', '▲', '1/6'] };
var g = document.getElementById('g');
for (var i = 0; i < 25; i++) {
  var c = document.createElement('div'); c.className = 'cell'; var t = T[i];
  if (t === 'w') c.innerHTML = '<span class="wall"></span>';
  else if (t === 'd') c.innerHTML = '<span class="dot"></span>';
  else if (t === 'd2') c.innerHTML = '<span class="dot l"></span><span class="dot r"></span>';
  else if (t) c.innerHTML = '<span class="tile" style="background:' + t[0] + '"><b>' + t[1] + '</b>' + t[2] + '</span>';
  g.appendChild(c);
}
</script>
</body></html>
