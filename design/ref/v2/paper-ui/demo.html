<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paper UI demo</title><link rel="stylesheet" href="paper-ui.css"><style>body{margin:0;font-family:Georgia,serif}.paper-card h1{text-align:center;letter-spacing:.16em;font-size:25px;margin:12px 0 5px}.paper-card p{text-align:center;margin:0 0 26px}.puzzle-grid{width:100%}.cell{position:relative}.cell span{display:grid;place-items:center;position:absolute;inset:5%;border-radius:4px;font:600 18px Georgia;color:white}.swatches{display:flex;justify-content:center;gap:8px;margin-top:25px}.swatches i{display:block;width:34px;height:34px;border-radius:4px}</style></head><body><main class="game-screen"><section class="paper-card"><div class="paper-content"><h1>OUTGROW</h1><p>LEVEL 4</p><div class="puzzle-grid" id="board"></div><div class="swatches"><i style="background:#D8A43C"></i><i style="background:#8EA97E"></i><i style="background:#6FA3BE"></i><i style="background:#D77A5E"></i></div></div></section></main><script>const board=document.querySelector('#board'); for(let i=0;i<25;i++){let cell=document.createElement('div');cell.className='cell';let colors={10:'#D8A43C',16:'#8EA97E',22:'#6FA3BE',24:'#D77A5E',3:'#2C3E5F',4:'#2C3E5F'};if(colors[i]){let s=document.createElement('span');s.style.background=colors[i];s.textContent=({10:'◆',16:'●',22:'■',24:'▲'})[i]||'';cell.append(s)}board.append(cell)}</script></body></html>
